<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Notification Router pipeline</title>
  <desc id="desc">Text, image, and voice messages pass through context retrieval, semantic scoring, and safety rules before being routed to notify, digest, or mute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.52" stop-color="#11101a"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0.78" cy="0.13" r="0.66">
      <stop offset="0" stop-color="#9c85ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9c85ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.12" cy="0.52" r="0.68">
      <stop offset="0" stop-color="#77e8da" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#77e8da" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#violetGlow)"/>
  <rect width="1920" height="900" fill="url(#cyanGlow)"/>
  <g opacity="0.18" stroke="#d7d2ee" stroke-width="1">
    <path d="M0 120H1920M0 240H1920M0 360H1920M0 480H1920M0 600H1920M0 720H1920"/>
    <path d="M240 0V900M480 0V900M720 0V900M960 0V900M1200 0V900M1440 0V900M1680 0V900"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="112" y="104" fill="#f4f3ef" font-size="31" font-weight="700" letter-spacing="4">MULTIMODAL ROUTING PIPELINE</text>
    <text x="112" y="150" fill="#8e8b98" font-size="21">Explainable decisions for high-volume messaging</text>
    <g transform="translate(1510 78)">
      <rect width="296" height="58" rx="29" fill="#171620" stroke="#b7a8ff" stroke-opacity="0.5"/>
      <circle cx="32" cy="29" r="6" fill="#77e8da"/>
      <text x="53" y="37" fill="#d8d4e3" font-size="19" letter-spacing="1">RANK #273 · 64.8</text>
    </g>

    <g transform="translate(112 246)" filter="url(#shadow)">
      <rect width="430" height="330" rx="28" fill="#111118" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="36" y="56" fill="#777481" font-size="16" letter-spacing="3">MESSAGE INPUTS</text>
      <g transform="translate(36 92)">
        <rect width="358" height="58" rx="16" fill="#181720" stroke="#77e8da" stroke-opacity="0.5"/>
        <circle cx="31" cy="29" r="10" fill="#77e8da" fill-opacity="0.18" stroke="#77e8da"/>
        <text x="59" y="36" fill="#e7e5ed" font-size="20">Text message</text>
        <text x="288" y="35" fill="#77e8da" font-size="15">NLP</text>
      </g>
      <g transform="translate(36 166)">
        <rect width="358" height="58" rx="16" fill="#181720" stroke="#b7a8ff" stroke-opacity="0.5"/>
        <rect x="21" y="19" width="21" height="21" rx="4" fill="#b7a8ff" fill-opacity="0.18" stroke="#b7a8ff"/>
        <text x="59" y="36" fill="#e7e5ed" font-size="20">Image attachment</text>
        <text x="288" y="35" fill="#b7a8ff" font-size="15">OCR</text>
      </g>
      <g transform="translate(36 240)">
        <rect width="358" height="58" rx="16" fill="#181720" stroke="#e7c66b" stroke-opacity="0.48"/>
        <path d="M29 18v22m-8-16v10m16-13v16" stroke="#e7c66b" stroke-width="3" stroke-linecap="round"/>
        <text x="59" y="36" fill="#e7e5ed" font-size="20">Voice note</text>
        <text x="288" y="35" fill="#e7c66b" font-size="15">ASR</text>
      </g>
    </g>

    <path d="M568 411H662" stroke="#77e8da" stroke-width="2" stroke-dasharray="8 9"/>
    <path d="M646 397l16 14-16 14" fill="none" stroke="#77e8da" stroke-width="2"/>

    <g transform="translate(688 246)" filter="url(#shadow)">
      <rect width="492" height="330" rx="28" fill="#111118" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="36" y="56" fill="#777481" font-size="16" letter-spacing="3">DECISION ENGINE</text>
      <g transform="translate(36 92)">
        <rect width="420" height="58" rx="16" fill="#181720"/>
        <text x="24" y="35" fill="#77e8da" font-size="17">01</text>
        <text x="65" y="36" fill="#e7e5ed" font-size="20">Context retrieval</text>
        <text x="322" y="35" fill="#8e8b98" font-size="15">history</text>
      </g>
      <g transform="translate(36 166)">
        <rect width="420" height="58" rx="16" fill="#181720"/>
        <text x="24" y="35" fill="#b7a8ff" font-size="17">02</text>
        <text x="65" y="36" fill="#e7e5ed" font-size="20">Semantic scoring</text>
        <text x="307" y="35" fill="#8e8b98" font-size="15">Gemini</text>
      </g>
      <g transform="translate(36 240)">
        <rect width="420" height="58" rx="16" fill="#181720"/>
        <text x="24" y="35" fill="#e7c66b" font-size="17">03</text>
        <text x="65" y="36" fill="#e7e5ed" font-size="20">Safety rules</text>
        <text x="281" y="35" fill="#8e8b98" font-size="15">deterministic</text>
      </g>
    </g>

    <path d="M1206 411H1300" stroke="#b7a8ff" stroke-width="2" stroke-dasharray="8 9"/>
    <path d="M1284 397l16 14-16 14" fill="none" stroke="#b7a8ff" stroke-width="2"/>

    <g transform="translate(1326 246)" filter="url(#shadow)">
      <rect width="480" height="330" rx="28" fill="#111118" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="36" y="56" fill="#777481" font-size="16" letter-spacing="3">ROUTED ACTION</text>
      <g transform="translate(36 92)">
        <rect width="408" height="58" rx="16" fill="#77e8da" fill-opacity="0.11" stroke="#77e8da" stroke-opacity="0.6"/>
        <circle cx="31" cy="29" r="8" fill="#77e8da"/>
        <text x="57" y="36" fill="#e7e5ed" font-size="20" font-weight="700">NOTIFY</text>
        <text x="292" y="35" fill="#77e8da" font-size="15">urgent</text>
      </g>
      <g transform="translate(36 166)">
        <rect width="408" height="58" rx="16" fill="#b7a8ff" fill-opacity="0.1" stroke="#b7a8ff" stroke-opacity="0.55"/>
        <circle cx="31" cy="29" r="8" fill="#b7a8ff"/>
        <text x="57" y="36" fill="#e7e5ed" font-size="20" font-weight="700">DIGEST</text>
        <text x="292" y="35" fill="#b7a8ff" font-size="15">later</text>
      </g>
      <g transform="translate(36 240)">
        <rect width="408" height="58" rx="16" fill="#e7c66b" fill-opacity="0.09" stroke="#e7c66b" stroke-opacity="0.5"/>
        <circle cx="31" cy="29" r="8" fill="#e7c66b"/>
        <text x="57" y="36" fill="#e7e5ed" font-size="20" font-weight="700">MUTE</text>
        <text x="292" y="35" fill="#e7c66b" font-size="15">unsafe</text>
      </g>
    </g>

    <g transform="translate(112 668)">
      <text x="0" y="0" fill="#777481" font-size="15" letter-spacing="2">EXPLAINABLE OUTPUT</text>
      <text x="0" y="42" fill="#d8d4e3" font-size="24">Every route includes a confidence score and human-readable reason.</text>
      <g transform="translate(1237 -22)">
        <rect width="457" height="86" rx="19" fill="#111118" stroke="#ffffff" stroke-opacity="0.13"/>
        <text x="24" y="34" fill="#8e8b98" font-size="15">confidence</text>
        <text x="24" y="65" fill="#77e8da" font-size="24" font-weight="700">0.94</text>
        <rect x="126" y="36" width="296" height="10" rx="5" fill="#24232d"/>
        <rect x="126" y="36" width="278" height="10" rx="5" fill="#77e8da"/>
      </g>
    </g>
  </g>
</svg>
